name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main, master]
  # Allows manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: 0.43.0

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Build WASM module
        run: |
          tinygo build -o frontend/src/lib/wasm/main.wasm -target wasm -no-debug ./cmd/wasm
          cp "$(tinygo env TINYGOROOT)/targets/wasm_exec.js" frontend/src/lib/wasm/wasm_exec_tiny.js

      - name: Build web frontend
        run: npm --prefix frontend run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
